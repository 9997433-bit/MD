name: Aetherboard Tests

on:
  push:
    paths:
      - 'aetherboard/**'
      - '.github/workflows/aetherboard-tests.yml'
  pull_request:
    paths:
      - 'aetherboard/**'

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aetherboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python3 -m unittest discover -s tests -q

  csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aetherboard/csharp/Aetherboard.Core.Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test --verbosity normal
