name: device_learning

on:
  push:
    paths:
      - "device_learning/**"
  pull_request:
    paths:
      - "device_learning/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device_learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: make ledger
      - run: make test
      - run: make verify
