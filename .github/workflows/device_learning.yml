name: device_learning

on:
  push:
    paths:
      - "device_learning/**"
      - ".github/workflows/device_learning.yml"
  pull_request:
    paths:
      - "device_learning/**"
      - ".github/workflows/device_learning.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device_learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: make ci
      - run: make health
      - run: make closure
